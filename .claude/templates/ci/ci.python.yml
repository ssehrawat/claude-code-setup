# ci.python.yml — GitHub Actions CI template for Python projects.
#
# Dropped into generated projects as .github/workflows/ci.yml by the engineer
# scaffold when pyproject.toml is detected. The docs-freshness job invokes the
# vendored gate at .github/scripts/check-docs-fresh.sh (committed alongside
# .github/scripts/classify-changes.sh — the runner has no ~/.claude install).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint
        run: |
          if command -v ruff >/dev/null 2>&1; then ruff check .
          elif command -v flake8 >/dev/null 2>&1; then flake8 .
          else echo "lint: skipped (no ruff/flake8 in the environment)"
          fi
      - name: Test
        run: |
          command -v pytest >/dev/null 2>&1 || pip install pytest
          pytest

  docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # WHY fetch-depth 0: the gate diffs against the merge base with the
          # target branch, which a shallow clone cannot compute.
          fetch-depth: 0
      # WHY `bash <path>` instead of executing directly: immune to a lost
      # executable bit (a common casualty of Windows checkouts).
      # WHY PR_BODY via env, not inline interpolation: the PR body is
      # attacker-controlled text; interpolating it into `run:` would allow
      # shell injection. As an env var it is inert data (D15 PR-body escape).
      - run: bash .github/scripts/check-docs-fresh.sh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
